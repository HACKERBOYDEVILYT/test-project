<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা টু Gibberlink অডিও ডাউনলোডার</title>
    <!-- স্ট্যাবল ও সরাসরি কার্যকর GGWave CDN ব্যবহার করা হচ্ছে -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #38bdf8; margin-bottom: 20px; }
        textarea {
            width: 90%;
            height: 80px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #334155;
            color: #fff;
            font-size: 16px;
            resize: none;
        }
        button {
            width: 95%;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
            font-weight: bold;
        }
        .play-btn { background-color: #0284c7; }
        .play-btn:hover { background-color: #0369a1; }
        .download-btn { background-color: #16a34a; display: none; }
        .download-btn:hover { background-color: #15803d; }
        .status { margin-top: 10px; font-size: 14px; color: #a1a1aa; }
        .footer { margin-top: 20px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gibberlink অডিও জেনারেটর 🚀</h2>
    <p>বাংলায় লিখে অডিও তৈরি ও ডাউনলোড করুন:</p>
    <textarea id="textInput" placeholder="এখানে বাংলা লিখুন... (যেমন: আমার ফোন)"></textarea>
    <br>
    <div id="statusMessage" class="status">লাইব্রেরি লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।</div>
    <button id="playBtn" class="play-btn" disabled>সাউন্ড প্লে করুন</button>
    <button id="downloadBtn" class="download-btn">📥 অডিও ফাইল ডাউনলোড করুন</button>
    <div class="footer">Powered by ggwave Technology</div>
</div>

<script>
    let ggwaveContext = null;
    let ggwave = null;
    let instance = null;
    let currentWavBlob = null;

    // অল্টারনেটিভ মেথডে লোড চেক করা
    function initGGWave() {
        if (typeof ggwave_factory === 'function') {
            ggwave_factory().then(function(obj) {
                ggwave = obj;
                let parameters = ggwave.getDefaultParameters();
                instance = ggwave.init(parameters);
                
                // সাকসেস হলে বাটন একটিভ করা এবং মেসেজ চেঞ্জ করা
                document.getElementById('playBtn').disabled = false;
                document.getElementById('statusMessage').innerHTML = "✅ লাইব্রেরি রেডি! এখন টাইপ করুন।";
                document.getElementById('statusMessage').style.color = "#4ade80";
            }).catch(err => {
                document.getElementById('statusMessage').innerHTML = "❌ লোড হতে ব্যর্থ হয়েছে। পেজ রিফ্রেশ দিন।";
                document.getElementById('statusMessage').style.color = "#f87171";
            });
        } else {
            // যদি মেইন ফ্যাক্টরি কাজ না করে তবে সরাসরি অবজেক্ট চেক করা
            setTimeout(initGGWave, 500); 
        }
    }

    window.onload = initGGWave;

    function bufferToWav(buffer) {
        let length = buffer.length * 2;
        let view = new DataView(new ArrayBuffer(44 + length));
        
        view.setUint32(0, 0x46464952, true); 
        view.setUint32(4, 36 + length, true);
        view.setUint32(8, 0x45564157, true); 
        view.setUint32(12, 0x20746d66, true); 
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, 48000, true); 
        view.setUint32(28, 48000 * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        view.setUint32(36, 0x61746164, true); 
        view.setUint40 ? view.setUint32(40, length, true) : view.setUint32(40, length, true);

        let offset = 44;
        for (let i = 0; i < buffer.length; i++, offset += 2) {
            let s = Math.max(-1, Math.min(1, buffer[i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return new Blob([view], { type: 'audio/wav' });
    }

    document.getElementById('playBtn').addEventListener('click', () => {
        const text = document.getElementById('textInput').value.trim();
        if (!text) {
            alert('দয়া করে প্রথমে কিছু লিখুন!');
            return;
        }

        if (!ggwaveContext) {
            ggwaveContext = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 48000});
        }

        try {
            // সেফ মোডে এনকোডিং রান করা
            const waveform = ggwave.encode(instance, text, 1, 10);
            
            if (!waveform || waveform.length === 0) {
                alert("অডিও তৈরি করা যায়নি।");
                return;
            }

            const buf = ggwaveContext.createBuffer(1, waveform.length, 48000);
            buf.getChannelData(0).set(waveform);
            const source = ggwaveContext.createBufferSource();
            source.buffer = buf;
            source.connect(ggwaveContext.destination);
            source.start();

            currentWavBlob = bufferToWav(waveform);
            document.getElementById('downloadBtn').style.display = 'block';

        } catch (e) {
            console.error(e);
            alert("প্রসেসিং এরর! অনুগ্রহ করে আবার চেষ্টা করুন।");
        }
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!currentWavBlob) return;
        const url = URL.createObjectURL(currentWavBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gibberlink_sound.wav';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
