<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibberlink Audio Generator - AI Protocol Tool</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #38bdf8;
            --primary-h: #0ea5e9;
            --success: #10b981;
            --success-h: #059669;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .app-card { background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border); padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); max-width: 460px; width: 100%; text-align: center; transition: 0.3s; }
        .app-card:hover { transform: translateY(-2px); }
        .logo-icon { font-size: 2.5rem; color: var(--primary); margin-bottom: 12px; }
        h1 { font-size: 1.6rem; font-weight: 700; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .sub { font-size: 0.9rem; color: #94a3b8; margin-bottom: 25px; }
        textarea { width: 100%; height: 110px; padding: 16px; border-radius: 14px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.6); color: #fff; font-size: 1rem; resize: none; outline: none; transition: 0.2s; }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; margin-top: 6px; }
        .status-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; padding: 10px 16px; border-radius: 30px; background: rgba(255, 255, 255, 0.04); margin: 20px 0; width: 100%; justify-content: center; color: #f59e0b; font-weight: 500; border: 1px solid rgba(255, 255, 255, 0.02); }
        .status-badge.ready { color: var(--success); background: rgba(16, 185, 129, 0.06); }
        .btn { width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; margin-bottom: 12px; }
        .btn-p { background: var(--primary); color: #0f172a; }
        .btn-p:hover:not(:disabled) { background: var(--primary-h); }
        .btn-p:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-s { background: var(--success); color: #fff; display: none; }
        .btn-s:hover { background: var(--success-h); }
        .foot { margin-top: 24px; font-size: 0.75rem; color: #64748b; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="app-card">
        <i class="fa-solid fa-circle-nodes logo-icon"></i>
        <h1>Gibberlink Protocol</h1>
        <div class="sub">AI-to-AI Audio Data Link Client</div>
        
        <textarea id="txt" maxlength="140" placeholder="বার্তাটি লিখুন (যেমন: সিস্টেম ট্র্যাকিং একটিভ)..."></textarea>
        <div class="meta">
            <span id="cnt">0 / 140 ক্যারেক্টার</span>
            <span>UTF-8 Engine</span>
        </div>
        
        <div id="st" class="status-badge">
            <i class="fa-solid fa-spinner fa-spin"></i> <span id="stTxt">Initializing Protocol Stack...</span>
        </div>
        
        <button id="pBtn" class="btn btn-p" disabled>
            <i class="fa-solid fa-waveform-lines"></i> অডিও সিগন্যাল প্লে করুন
        </button>
        <button id="dBtn" class="btn btn-s">
            <i class="fa-solid fa-arrow-down-to-line"></i> অডিও ফাইল ডাউনলোড (.WAV)
        </button>
        
        <div class="foot">SECURE AUDIBLE COMMUNICATION INTERFACE</div>
    </div>

<script>
    const App = { ctx: null, gg: null, inst: null, blob: null };
    const dom = {
        txt: document.getElementById('txt'), cnt: document.getElementById('cnt'),
        st: document.getElementById('st'), stTxt: document.getElementById('stTxt'),
        pBtn: document.getElementById('pBtn'), dBtn: document.getElementById('dBtn')
    };

    dom.txt.addEventListener('input', (e) => { dom.cnt.textContent = `${e.target.value.length} / 140 ক্যারেক্টার`; });

    function init() {
        if (typeof ggwave_factory === 'function') {
            ggwave_factory().then(obj => {
                App.gg = obj;
                App.inst = App.gg.init(App.gg.getDefaultParameters());
                dom.st.className = "status-badge ready";
                dom.stTxt.textContent = "Protocol Stack Ready";
                dom.st.querySelector('i').className = "fa-solid fa-circle-check";
                dom.pBtn.disabled = false;
            }).catch(() => {
                dom.st.className = "status-badge"; dom.st.style.color = "#ef4444";
                dom.stTxt.textContent = "Engine Fail."; dom.st.querySelector('i').className = "fa-solid fa-circle-exclamation";
            });
        } else { setTimeout(init, 300); }
    }

    function makeWav(buffer) {
        const len = buffer.length * 2;
        const view = new DataView(new ArrayBuffer(44 + len));
        const str = (pos, s) => { for (let i=0; i<s.length; i++) view.setUint8(pos+i, s.charCodeAt(i)); };
        
        str(0, 'RIFF'); view.setUint32(4, 36 + len, true); str(8, 'WAVE'); str(12, 'fmt ');
        view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, 48000, true); view.setUint32(28, 96000, true); view.setUint16(32, 2, true);
        view.setUint16(34, 16, true); str(36, 'data'); view.setUint32(40, len, true);

        for (let i=0, p=44; i<buffer.length; i++, p+=2) {
            let s = Math.max(-1, Math.min(1, buffer[i]));
            view.setInt16(p, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return new Blob([view], { type: 'audio/wav' });
    }

    dom.pBtn.addEventListener('click', () => {
        const val = dom.txt.value.trim();
        if (!val) return;
        if (!App.ctx) App.ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });

        try {
            const wave = App.gg.encode(App.inst, val, 1, 10);
            if (!wave || wave.length === 0) return;

            const buf = App.ctx.createBuffer(1, wave.length, 48000);
            buf.getChannelData(0).set(wave);
            const src = App.ctx.createBufferSource();
            src.buffer = buf; src.connect(App.ctx.destination); src.start();

            App.blob = makeWav(wave);
            dom.dBtn.style.display = 'flex';
        } catch (e) { console.error(e); }
    });

    dom.dBtn.addEventListener('click', () => {
        if (!App.blob) return;
        const url = URL.createObjectURL(App.blob);
        const a = document.createElement('a');
        a.href = url; a.download = `gibberlink_${Date.now()}.wav`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
    });

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
